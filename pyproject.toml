[project]
name = 'tcc'
version = '0.1.0'
description = 'Add your description here'
readme = 'README.md'
requires-python = '>=3.13'
dependencies = [
  "cryptography>=44.0.0",
  "fastapi[standard]>=0.141.1",
  "pwdlib[argon2]>=0.3.1",
  "email-validator>=2.2.0",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.13.1",
  "pyjwt>=2.15.0",
  "sqlalchemy[asyncio]>=2.1.1",
  "python-multipart>=0.0.32",
  "alembic>=1.20.0",
  "psycopg[binary]>=3.3.6",
  "langchain>=1.4.6",
  "langchain-openrouter>=0.2.8",
  "langchain-ollama>=1.0.0",
  "langgraph>=1.2.16",
  "opentelemetry-sdk>=1.39.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.39.0",
  "opentelemetry-instrumentation-logging>=0.60b0",
  "aioboto3>=15.5.0",
]

[tool.ruff]
line-length = 80
target-version = 'py313'
fix = true
show-fixes = true
indent-width = 4
exclude = [
  '__init__',
  'venv',
  '.venv',
  'env',
  '.env',
  '__pycache__',
  'migrations',
]

[tool.ruff.lint]
select = ['I', 'F', 'E', 'W', 'PL', 'PT']
ignore = ['PT018']

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'
line-ending = 'lf'

[tool.pyright]
typeCheckingMode = 'standard'
pythonVersion = '3.13'
include = ['src']
exclude = ['**/venv', '**/.venv', '**/env', '**/.env', '**/__pycache__']
venv = '.venv'
venvPath = '.'
executionEnvironments = [{ root = 'src' }]
reportMissingTypeStubs = true
stubPath = 'stubs'

[tool.pytest.ini_options]
pythonpath = ['.', 'src']
addopts = '-p no:warnings'
asyncio_default_fixture_loop_scope = 'function'

[tool.coverage.run]
omit = ['*/tests/*', '*/agents/migrations/*', '*/main.py', 'src/infra/app.py']

[tool.taskipy.tasks]
lint = 'ruff check src/'
pre_format = 'ruff check src/ --fix'
format = 'ruff format src/'

server = 'fastapi dev src/main.py'

pre_test = 'task lint'
test = 'pytest src/ -s -x --cov=src -vv'
post_test = 'coverage html'

[dependency-groups]
dev = [
  "aiosqlite>=0.22.1",
  "httpx>=0.28.1",
  "httpx2>=2.13.1",
  "mypy>=2.3.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.5",
  "taskipy>=1.14.1",
  "testcontainers[postgres]>=4.10.0",
]
