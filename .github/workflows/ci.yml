name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verificar título do Pull Request
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar o python
        uses: actions/setup-python@v7
        with: 
          python-version: '3.13'

      - name: Instalar UV
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4

      - name: Instalar dependências
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run task lint

      - name: Rodar testes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_ALGORITHM: "HS256"
          JWT_EXPIRES_IN_MINUTES: 15
          RUSTFS_ACCESS_KEY: ${{ secrets.RUSTFS_ACCESS_KEY }}
          RUSTFS_SECRET_KEY: ${{ secrets.RUSTFS_SECRET_KEY }}
          RUSTFS_ENDPOINT_URL: ${{ secrets.RUSTFS_ENDPOINT_URL }}
          RUSTFS_PUBLIC_ENDPOINT_URL: ${{ secrets.RUSTFS_PUBLIC_ENDPOINT_URL }}
          RUSTFS_BUCKET: ${{ secrets.RUSTFS_BUCKET }}
          RUSTFS_REGION: ${{ secrets.RUSTFS_REGION }}
          RUSTFS_PRESIGNED_URL_TTL_SECONDS: ${{ secrets.RUSTFS_PRESIGNED_URL_TTL_SECONDS }}
          RUSTFS_CORS_ALLOWED_ORIGINS: ${{ secrets.RUSTFS_CORS_ALLOWED_ORIGINS }}
          OTEL_SERVICE_NAME: ${{ secrets.OTEL_SERVICE_NAME }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_LOGS_ENDPOINT }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: uv run task test
