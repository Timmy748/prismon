include:
  - path: compose.telemetry.yaml

services:
  prismon_api:
    image: prismon_api
    build:
      context: .
      dockerfile: dockerfile
    entrypoint: ["/app/entrypoint.sh"]
    ports: 
      - 8000:8000
    depends_on:
      postgres_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      otel_collector:
        condition: service_started
      ollama:
        condition: service_healthy
    env_file: .env
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  postgres_db:
    image: paradedb/paradedb:0.26.4-pg16
    volumes: 
      - pg_data:/var/lib/postgresql/
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--user", "default", "off",
        "--user", "${REDIS_USERNAME}", "on", ">${REDIS_PASSWORD}", "~*", "&*", "+@all"
      ]
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-u", "redis://${REDIS_USERNAME}:${REDIS_PASSWORD}@redis:6379/0", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker_short:
    image: prismon_api
    build:
      context: .
      dockerfile: dockerfile
    entrypoint: ["celery", "-A", "infra.celery_app:celery_app", "worker", "--queues=short_tasks", "--hostname=short@%h"]
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      ollama:
        condition: service_healthy

  celery_worker_long:
    image: prismon_api
    build:
      context: .
      dockerfile: dockerfile
    entrypoint: ["celery", "-A", "infra.celery_app:celery_app", "worker", "--queues=long_tasks", "--hostname=long@%h"]
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      ollama:
        condition: service_healthy

  celery_beat:
    image: prismon_api
    build:
      context: .
      dockerfile: dockerfile
    entrypoint: ["celery", "-A", "infra.celery_app:celery_app", "beat", "--loglevel=info"]
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres_db:
        condition: service_healthy

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command: ["/data"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS}
      RUSTFS_NOTIFY_ENABLE: "true"
      RUSTFS_NOTIFY_WEBHOOK_ENABLE_PRIMARY: "on"
      RUSTFS_NOTIFY_WEBHOOK_ENDPOINT_PRIMARY: http://prismon_api:8000/internal/webhooks/rustfs
      RUSTFS_NOTIFY_WEBHOOK_AUTH_TOKEN_PRIMARY: ${RUSTFS_WEBHOOK_AUTH_TOKEN}
      RUSTFS_NOTIFY_WEBHOOK_QUEUE_DIR_PRIMARY: /data/rustfs-events
      RUSTFS_OUTBOUND_ALLOW_ORIGINS: http://prismon_api:8000
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "/ollama-entrypoint.sh"]
    gpus: all
    restart: unless-stopped
    ports:
      - 11434:11434
    environment:
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL}
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-entrypoint.sh:/ollama-entrypoint.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ollama show \"$${OLLAMA_EMBEDDING_MODEL}\" >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 2m

volumes:
  pg_data:
    name: pg_data
  ollama_data:
    name: ollama_data
  rustfs_data:
    name: rustfs_data
  rabbitmq_data:
    name: rabbitmq_data
  redis_data:
    name: redis_data

