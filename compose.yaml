include:
  - path: compose.telemetry.yaml

services:
  prismon_api:
    image: prismon_api
    build:
      context: .
      dockerfile: dockerfile
    entrypoint: ["/app/entrypoint.sh"]
    ports: 
      - 8000:8000
    depends_on:
      postgres_db:
        condition: service_healthy
      otel_collector:
        condition: service_started
    env_file: .env

  postgres_db:
    image: postgres
    volumes: 
      - pg_data:/var/lib/postgresql/
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    profiles:
      - dev
    restart: unless-stopped
    ports:
      - 11434:11434
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pg_data:
    name: pg_data
  ollama_data:
    name: ollama_data

